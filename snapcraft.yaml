name: dici
version: "0.1.1"
summary: A portuguese dictionary for the terminal.
description: |
  Portuguese dictionary for the terminal.
  Dicionário de português para o terminal.

grade: stable
confinement: strict
base: core24

apps:
  dici:
    command: bin/dici
    plugs: [home, network]

parts:
  nim-compiler:
    plugin: nil
    source: https://github.com/nim-lang/Nim/archive/refs/tags/v2.2.6.tar.gz # Use latest version
    source-type: tar
    build-packages:
      - build-essential
      - tar
      - git
      - xz-utils
    override-build: |
      set -eux
      cd $SNAPCRAFT_PART_SRC
      ./build_all.sh
      ./bin/nim c -d:release koch
      ./koch boot -d:release
      ./koch tools
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cp -r bin/* $SNAPCRAFT_PART_INSTALL/bin/
      cp -r lib $SNAPCRAFT_PART_INSTALL/
      cp -r config $SNAPCRAFT_PART_INSTALL/

  dici:
    plugin: nil
    after:
      - nim-compiler
    source: .
    build-packages:
      - build-essential
    stage-packages:
      - libc6
    override-build: |
      set -eux
      # Set up Nim path
      export PATH=$SNAPCRAFT_STAGE/bin:$PATH
      export NIM_LIB_PREFIX=$SNAPCRAFT_STAGE/lib
      # Build the application
      nim c -d:release --out:$SNAPCRAFT_PART_INSTALL/bin/dici src/dici.nim
      chmod +x $SNAPCRAFT_PART_INSTALL/bin/dici
